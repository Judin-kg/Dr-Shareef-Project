<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- ================= BASIC SEO ================= -->
    <title>Dr A M Shareef | Dental Surgeon & BNI Executive Director</title>

    <meta
      name="description"
      content="Official website of Dr. A.M. Shareef — Dental Surgeon, BNI Executive Director and community leader. Discover dental services, leadership initiatives, blogs and achievements."
    />

    <meta
      name="keywords"
      content="Dr A M Shareef, Shareef dentist, TANZA Dental, Kerala dentist, dental surgeon India, BNI Executive Director, oral health, dental clinic, leadership, community service"
    />

    <meta name="author" content="Dr. A.M. Shareef" />
    <link rel="canonical" href="https://www.drshareef.com/" />

    <!-- ================= GOOGLE INDEXING ================= -->
    <meta name="robots" content="index, follow" />

    <!-- ================= OPEN GRAPH (WhatsApp/Facebook) ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.drshareef.com/" />
    <meta property="og:title" content="Dr A M Shareef | Dental Surgeon & BNI Executive Director" />
    <meta
      property="og:description"
      content="Explore the professional journey, dental expertise, leadership initiatives and community contributions of Dr. A.M. Shareef."
    />
    <meta property="og:image" content="https://www.drshareef.com/shareef-preview.jpg" />
    <meta property="og:site_name" content="Dr A M Shareef" />

    <!-- ================= TWITTER ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dr A M Shareef | Dental Surgeon & BNI Executive Director" />
    <meta
      name="twitter:description"
      content="Official website of Dr A.M. Shareef — Dentistry, leadership & community development."
    />
    <meta name="twitter:image" content="https://www.drshareef.com/shareef-preview.jpg" />

    <!-- ================= MOBILE ================= -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Dr.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ================= LOCAL BUSINESS SCHEMA ================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Dr A M Shareef",
        "image": "https://www.drshareef.com/shareef-preview.jpg",
        "url": "https://www.drshareef.com",
        "telephone": "+91-XXXXXXXXXX",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "TANZA Dental Clinic",
          "addressLocality": "Kerala",
          "addressRegion": "Kerala",
          "postalCode": "670000",
          "addressCountry": "IN"
        },
        "openingHours": "Mo-Sa 09:00-18:00",
        "sameAs": [
          "https://www.facebook.com/",
          "https://www.instagram.com/",
          "https://www.linkedin.com/"
        ]
      }
    </script>

    <!-- ================= PERFORMANCE ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

    <div id="root"></div>
